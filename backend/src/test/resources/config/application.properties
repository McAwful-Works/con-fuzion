# Test-only overrides, layered over src/main/resources/application.properties (Boot loads classpath:/config/ too).
# Placeholder Discord credentials: tests never reach the real Discord.
spring.security.oauth2.client.registration.discord.client-id=test-client-id
spring.security.oauth2.client.registration.discord.client-secret=test-client-secret

# The reminder job (#66) and the offer expiry job (#65) must not fire during a test: tests run them themselves.
con-fuzion.notify.reminder-interval=PT24H
con-fuzion.offers.expiry-interval=PT24H
