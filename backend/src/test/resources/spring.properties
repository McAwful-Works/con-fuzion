# Spring Framework 7 pauses (stops) cached test contexts on a context switch and restarts them on reuse. A restarted
# LettuceConnectionFactory builds a new client, while the rate limiter's ProxyManager keeps the one it was built on
# (see RateLimiterConfig). Deployed apps never stop and restart the factory while serving, so keep contexts running.
spring.test.context.cache.pause=never
