#Application properties
spring.application.name=confuzion-backend
spring.threads.virtual.enabled=${CONFUZION_VIRTUAL_THREAD_ENABLE:true}

# Client IP behind the ALB. Tomcat's RemoteIpValve reads X-Forwarded-For right to left and stops at the first address
# that isn't a trusted (private-range) proxy, so request.getRemoteAddr() is the address the ALB actually saw.
# Don't use "framework": Spring's ForwardedHeaderFilter takes the left-most value, which the client controls.
server.forward-headers-strategy=native

# Postgres, the system of record. The defaults match infra/docker-compose.yml.
spring.datasource.url=jdbc:postgresql://${CONFUZION_DB_HOST:localhost}:${CONFUZION_DB_PORT:5432}/${CONFUZION_DB_NAME:confuzion}
spring.datasource.username=${CONFUZION_DB_USERNAME:confuzion}
spring.datasource.password=${CONFUZION_DB_PASSWORD:confuzion}

# Valkey, for sessions and rate limits only. The defaults match infra/docker-compose.yml.
spring.data.redis.host=${CONFUZION_REDIS_HOST:localhost}
spring.data.redis.port=${CONFUZION_REDIS_PORT:6379}
spring.data.redis.password=${CONFUZION_REDIS_PASSWORD:confuzion}
spring.data.redis.ssl.enabled=${CONFUZION_REDIS_SSL:false}

# Sessions (Spring Session in Valkey)
spring.session.timeout=14d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# Actuator: health is public. Every other endpoint is loopback-only (see ActuatorAccessFilter).
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health,metrics
management.endpoints.web.discovery.enabled=false
