#Application properties
spring.application.name=confuzion-backend
spring.threads.virtual.enabled=${CONFUZION_VIRTUAL_THREAD_ENABLE:true}

# Client IP behind the ALB. Tomcat's RemoteIpValve reads X-Forwarded-For right to left and stops at the first address
# that isn't a trusted (private-range) proxy, so request.getRemoteAddr() is the address the ALB actually saw.
# Don't use "framework": Spring's ForwardedHeaderFilter takes the left-most value, which the client controls.
server.forward-headers-strategy=native

# Postgres, the system of record. The defaults match infra/docker-compose.yml.
spring.datasource.url=jdbc:postgresql://${CONFUZION_DB_HOST:localhost}:${CONFUZION_DB_PORT:5432}/${CONFUZION_DB_NAME:confuzion}
spring.datasource.username=${CONFUZION_DB_USERNAME:confuzion}
spring.datasource.password=${CONFUZION_DB_PASSWORD:confuzion}
# No session held open through the view: database access stays inside @Transactional services.
spring.jpa.open-in-view=false

# Valkey, for sessions and rate limits only. The defaults match infra/docker-compose.yml.
spring.data.redis.host=${CONFUZION_REDIS_HOST:localhost}
spring.data.redis.port=${CONFUZION_REDIS_PORT:6379}
spring.data.redis.password=${CONFUZION_REDIS_PASSWORD:confuzion}
spring.data.redis.ssl.enabled=${CONFUZION_REDIS_SSL:false}
# Every controller call does a rate-limit round trip, so fail fast instead of Lettuce's 60s default.
spring.data.redis.timeout=2s

# Sessions (Spring Session in Valkey)
spring.session.timeout=14d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# Actuator: health is public. Every other endpoint is loopback-only (see ActuatorAccessFilter).
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health,metrics
management.endpoints.web.discovery.enabled=false

# The built PWA is served from classpath:/static/ by SpaWebConfig, which owns /** (SPA fallback and cache headers).
spring.web.resources.add-mappings=false

# OpenAPI (springdoc). Sorted, pretty-printed output keeps docs/api/openapi.json stable, so the drift check in CI
# only fails on a real contract change.
# Only the /api contract: the container's /error fallback isn't an endpoint clients call.
springdoc.paths-to-match=/api/**
springdoc.default-produces-media-type=application/json
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true

# Spring Session uses the indexed repository, so "log out everywhere" can find a user's sessions by principal name.
# configure-action=none: managed Valkey (ElastiCache) refuses CONFIG, and nothing here needs keyspace events.
spring.session.data.redis.repository-type=indexed
spring.session.data.redis.configure-action=none

# Discord sign-in (plan B5). Scopes are exactly identify and guilds: no email (plan B11, data minimization).
# The client ID and secret come only from the environment, and startup fails without them.
spring.security.oauth2.client.registration.discord.client-id=${CONFUZION_DISCORD_CLIENT_ID}
spring.security.oauth2.client.registration.discord.client-secret=${CONFUZION_DISCORD_CLIENT_SECRET}
spring.security.oauth2.client.registration.discord.client-name=Discord
spring.security.oauth2.client.registration.discord.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.discord.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.discord.scope=identify,guilds
spring.security.oauth2.client.registration.discord.redirect-uri={baseUrl}/api/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.discord.authorization-uri=https://discord.com/oauth2/authorize
spring.security.oauth2.client.provider.discord.token-uri=https://discord.com/api/oauth2/token
# Pinned to v10: Discord doesn't document which version unversioned calls get. The guild list is this URI + /guilds.
spring.security.oauth2.client.provider.discord.user-info-uri=https://discord.com/api/v10/users/@me

# Discord IDs that get ADMIN at login, but only while their Discord account has MFA on (plan B12). Comma-separated.
con-fuzion.admin.bootstrap-discord-ids=${CONFUZION_ADMIN_BOOTSTRAP_DISCORD_IDS:}

# The app's public origin, with no path. Invite links (D-011) are built from it, never from the request's Host or
# X-Forwarded-Host, which a client can set. Production sets CONFUZION_APP_ORIGIN; the default suits bootRun.
con-fuzion.app.origin=${CONFUZION_APP_ORIGIN:http://localhost:8080}

# Web Push (D-014). The VAPID key pair comes only from the environment (Secrets Manager in production): base64url, the
# public key as an uncompressed P-256 point and the private key as its raw 32-byte scalar. With neither set, push is
# off: /api/push/key is a 404 and nothing is sent. Generating and rotating them: docs/security.md.
con-fuzion.push.vapid.public-key=${CONFUZION_VAPID_PUBLIC_KEY:}
con-fuzion.push.vapid.private-key=${CONFUZION_VAPID_PRIVATE_KEY:}
