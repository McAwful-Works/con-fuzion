plugins {
    id 'java'
    id 'org.springframework.boot' version '4.2.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'com.diffplug.spotless' version '8.12.0'
}

group = 'app.confuzion'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jacoco {
    // 0.8.14 is the first release that can instrument Java 25 class files.
    toolVersion = "0.8.16"
}

repositories {
    mavenCentral()
}

dependencies {
    // Application dependencies
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // Boot 4 no longer pulls AOP in through the JPA starter; the aspect/ package needs it.
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    // TODO: Add security dependencies when oauth2 implementation begins (versions come from the Boot BOM)
//    implementation 'org.springframework.boot:spring-boot-starter-security'
//    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.1'
    implementation 'org.codehaus.janino:janino:3.1.12'
    implementation 'com.bucket4j:bucket4j-core:8.10.1'
    annotationProcessor 'org.projectlombok:lombok'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Project specific dependencies
    implementation 'org.postgresql:postgresql'
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        // Pinned so local and CI runs format identically whatever JDK runs Gradle. 4.31 is the newest JDT that runs
        // on JDK 17; it knows Java 21 syntax, so bump it once Gradle itself runs on JDK 21+ everywhere.
        eclipse('4.31').configFile('config/spotless/eclipse-formatter.xml')
        licenseHeaderFile 'config/spotless/license-header.txt'
    }
}

tasks.named('bootBuildImage') {
    builder = 'paketobuildpacks/builder-jammy-base:latest'
}

def excludedTags = providers.gradleProperty('excludeTags')

tasks.named('test') {
    useJUnitPlatform {
        // ./gradlew test -PexcludeTags=integration[,slow]
        def tags = excludedTags.getOrElse('').split(',')*.trim().findAll { it }
        if (tags) {
            excludeTags(*tags)
        }
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit {
                minimum = 0.8
            }
        }

        rule {
            enabled = false
            element = 'CLASS'
            includes = ['app.confuzion.*']

            limit {
                counter = 'LINE'
                value = 'TOTALCOUNT'
                maximum = 0.3
            }
        }
    }
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}
