plugins {
    id 'java'
    id 'org.springframework.boot' version '4.2.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'com.diffplug.spotless' version '8.12.0'
}

group = 'app.confuzion'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jacoco {
    // 0.8.14 is the first release that can instrument Java 25 class files.
    toolVersion = "0.8.16"
}

repositories {
    mavenCentral()
}

dependencies {
    // Application dependencies
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // Bean Validation on request DTOs (plan B6). springdoc already brings Hibernate Validator transitively; declaring it
    // keeps validation from disappearing if springdoc ever drops it. Adds no new jars.
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // Boot 4 no longer pulls AOP in through the JPA starter; the aspect/ package needs it.
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    // Discord sign-in (plan B5). Versions come from the Boot BOM.
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.1'
    implementation 'org.codehaus.janino:janino:3.1.12'
    // Boot 4 ships each auto-configuration in its own module, so Flyway and Spring Session need their starters
    // (which bring flyway-core and spring-session-data-redis) rather than the bare libraries.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'
    // Distributed rate-limit buckets in Valkey; brings bucket4j_jdk17-core.
    implementation 'com.bucket4j:bucket4j_jdk17-lettuce:8.23.0'
    // The per-task 1-second cache of /spots counts (plan B2, D-013). Version from the Boot BOM.
    implementation 'com.github.ben-manes.caffeine:caffeine'
    // Web Push (RFC 8030/8291/8292, D-014): message encryption and VAPID. No runtime dependencies; used with the JDK
    // HttpClient, so none of its optional HTTP client integrations come in.
    implementation 'com.zerodeplibs:zerodep-web-push-java:2.1.5'
    annotationProcessor 'org.projectlombok:lombok'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Project specific dependencies
    implementation 'org.postgresql:postgresql'
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        // Pinned so local and CI runs format identically whatever JDK runs Gradle. 4.31 is the newest JDT that runs
        // on JDK 17; it knows Java 21 syntax, so bump it once Gradle itself runs on JDK 21+ everywhere.
        eclipse('4.31').configFile('config/spotless/eclipse-formatter.xml')
        licenseHeaderFile 'config/spotless/license-header.txt'
    }
}

tasks.named('bootBuildImage') {
    builder = 'paketobuildpacks/builder-jammy-base:latest'
}

def excludedTags = providers.gradleProperty('excludeTags')

tasks.named('test') {
    useJUnitPlatform {
        // ./gradlew test -PexcludeTags=integration[,slow]
        def tags = excludedTags.getOrElse('').split(',')*.trim().findAll { it }
        if (tags) {
            excludeTags(*tags)
        }
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit {
                minimum = 0.8
            }
        }

        rule {
            enabled = false
            element = 'CLASS'
            includes = ['app.confuzion.*']

            limit {
                counter = 'LINE'
                value = 'TOTALCOUNT'
                maximum = 0.3
            }
        }
    }
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}

// ---- Frontend: bundle the built PWA into the jar (D-003) ----
// Only bootJar builds and packages the SPA, so test and check never need Node.
// ./gradlew bootJar -PskipFrontend builds an API-only jar.
def frontendDir = layout.projectDirectory.dir('../frontend')
def skipFrontend = providers.gradleProperty('skipFrontend').isPresent()
def npm = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

def frontendInstall = tasks.register('frontendInstall', Exec) {
    workingDir frontendDir
    commandLine npm, 'ci'
    inputs.file frontendDir.file('package-lock.json')
    outputs.dir frontendDir.dir('node_modules')
}

def frontendBuild = tasks.register('frontendBuild', Exec) {
    dependsOn frontendInstall
    workingDir frontendDir
    commandLine npm, 'run', 'build'
    inputs.files(fileTree(frontendDir) {
        include 'src/**', 'public/**', 'index.html', 'package.json', 'package-lock.json', 'tsconfig*.json', 'vite.config.ts'
    })
    outputs.dir frontendDir.dir('dist')
}

tasks.named('bootJar') {
    if (!skipFrontend) {
        dependsOn frontendBuild
        from(frontendDir.dir('dist')) {
            into 'BOOT-INF/classes/static'
        }
    }
}
