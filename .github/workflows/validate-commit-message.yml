name: Validate Commit Messages

on:
  pull_request:
    types:
      - opened
      - synchronize
      - edited

jobs:
  check-commit-message:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Fetch the commit history for the pull request
      - name: Fetch commits
        run: git fetch --prune --unshallow

      # Step 3: Validate commit messages
      - name: Validate commit messages
        run: |
          git log origin/${{ github.base_ref }}..origin/${{ github.head_ref }} --pretty=format:"%s" | while read commit_message; do
            if ! [[ $commit_message =~ ^Dooble ]]; then
              echo "Commit message does not start with 'Dooble': $commit_message"
              exit 1
            fi
          done
