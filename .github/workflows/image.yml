name: Image

# Builds the container image on pull requests, so a change that breaks it fails before the merge. Nothing is pushed:
# publishing the image belongs to the deploy workflows (M6).
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/image.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The build runs the committed wrapper jar: fail if it isn't an official Gradle release.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build the image (not pushed)
        run: docker build --tag confuzion:ci .
