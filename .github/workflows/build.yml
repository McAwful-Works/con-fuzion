name: Build

# The full deployable (backend jar with the built PWA inside, D-003), built once per merge to main.
# Pull requests keep running Backend and Frontend separately, so this job stays off the PR path.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle
            backend/gradle/wrapper/gradle-wrapper.properties

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # bootJar runs `npm ci` and `npm run build` in frontend/ and copies dist/ into the jar.
      - name: Build the jar
        working-directory: backend
        run: ./gradlew bootJar --console=plain

      - name: Check the SPA is inside the jar
        run: unzip -l backend/build/libs/*.jar | grep -F 'BOOT-INF/classes/static/index.html'
