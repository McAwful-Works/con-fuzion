name: Backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/api/**'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docs/api/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The wrapper jar is a committed binary: fail if it isn't an official Gradle release.
      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle
            backend/gradle/wrapper/gradle-wrapper.properties

      # Spotless, all tests (including integration), and the JaCoCo coverage gate. OpenApiConfigIntegrationTest
      # regenerates docs/api/openapi.json along the way.
      - name: Check
        run: ./gradlew check --console=plain

      # The committed contract must match the code. To update it:
      # cd backend && ./gradlew test --tests '*OpenApiConfigIntegrationTest', then commit docs/api/openapi.json.
      - name: OpenAPI drift check
        run: |
          # status, not just diff, so a missing or untracked file also fails.
          if [ -n "$(git status --porcelain -- ../docs/api)" ]; then
            git status --short -- ../docs/api
            git diff -- ../docs/api
            echo "::error file=docs/api/openapi.json::docs/api/openapi.json is out of date. Run ./gradlew test --tests '*OpenApiConfigIntegrationTest' in backend/ and commit the result."
            exit 1
          fi
