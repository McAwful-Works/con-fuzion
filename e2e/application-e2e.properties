# Points the backend's Discord provider at the fake Discord (e2e/fake-discord.mjs). Passed at startup with
#   --spring.config.additional-location=file:e2e/application-e2e.properties
# and never part of the jar, so a production build can't point at the stub. Every value here is a dummy.
spring.security.oauth2.client.registration.discord.client-id=e2e-client-id
spring.security.oauth2.client.registration.discord.client-secret=e2e-client-secret
# The authorize URI is opened by the browser, the other two are called by the backend.
spring.security.oauth2.client.provider.discord.authorization-uri=http://127.0.0.1:${E2E_STUB_PORT:4010}/oauth2/authorize
spring.security.oauth2.client.provider.discord.token-uri=http://127.0.0.1:${E2E_STUB_PORT:4010}/api/oauth2/token
spring.security.oauth2.client.provider.discord.user-info-uri=http://127.0.0.1:${E2E_STUB_PORT:4010}/api/v10/users/@me
