# Points the backend's Discord provider at the fake Discord (e2e/fake-discord.mjs). Passed at startup with
#   --spring.config.additional-location=file:e2e/application-e2e.properties
# and never part of the jar, so a production build can't point at the stub. Every value here is a dummy.
spring.security.oauth2.client.registration.discord.client-id=e2e-client-id
spring.security.oauth2.client.registration.discord.client-secret=e2e-client-secret
# The authorize URI is opened by the browser, the other two are called by the backend.
spring.security.oauth2.client.provider.discord.authorization-uri=http://127.0.0.1:${E2E_STUB_PORT:4010}/oauth2/authorize
spring.security.oauth2.client.provider.discord.token-uri=http://127.0.0.1:${E2E_STUB_PORT:4010}/api/oauth2/token
spring.security.oauth2.client.provider.discord.user-info-uri=http://127.0.0.1:${E2E_STUB_PORT:4010}/api/v10/users/@me

# The suite tests features, not rate limiting (the backend's own tests cover the limiter). The default burst of 10
# requests per user is tripped by tests that reload a 160-server page and call the API in quick succession, which
# made test 8 fail with a 429 depending on CI timing.
con-fuzion.rate-limiter.token.capacity=10000
con-fuzion.rate-limiter.token.refill-amount=10000
con-fuzion.rate-limiter.refill-rate-seconds=1
# Joins are limited to about one a second per user (D-013 rule 16). Tests that leave and rejoin, or retry after a
# failed join, would trip it by timing alone; the backend's own tests cover the limit.
con-fuzion.rate-limiter.join.capacity=10000

# The one bootstrap admin (D-015): this Discord ID gets ADMIN at sign-in, in effect while the fake reports 2FA on.
# tests/admin.mjs signs in as it and grants every other role through the app. It is a made-up ID no other test user can
# have (theirs start with 41).
con-fuzion.admin.bootstrap-discord-ids=400000000000000001

# Invite links point at the jar the suite runs (playwright.config.mjs baseURL).
con-fuzion.app.origin=http://localhost:${E2E_APP_PORT:8089}

# An offer's window can't be shorter than 10 minutes (a database CHECK and @Min(10)), so the suite can't wait for one
# to run out. It pushes an open offer's deadline into the past instead, and a short job interval makes the expiry job
# (which offers the spot on to the next person) run within seconds. The default is 30 seconds.
con-fuzion.offers.expiry-interval=PT2S
# The Web Push sender would try to deliver to the fake endpoints the push test subscribes with. Nothing in the suite
# depends on it, so it runs once an hour, which is never within a run.
con-fuzion.push.send-interval=PT1H
